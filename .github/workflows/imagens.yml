# Registo de imagens: constrói as imagens Docker dos serviços e publica-as no
# GitHub Container Registry (ghcr.io). O cluster Kubernetes (kind) vai buscá-las lá para subir.
#
# Cada imagem sai para as duas arquiteturas: amd64 (Windows e Macs Intel) e arm64
# (Macs M1 a M4). No kind, os nós são contentores no próprio computador, por isso a
# imagem tem de ser da arquitetura dele.
#
# Corre sozinho a cada push para a main ou para uma dev-sprint* que mexa no backend,
# e também à mão: GitHub > Actions > Imagens > Run workflow.
#
# Cada imagem fica com duas etiquetas (tags):
#   ghcr.io/joshuacamilo09/slotup-auth:<commit>       versão exata, para o Kubernetes
#   ghcr.io/joshuacamilo09/slotup-auth:<branch>       a mais recente dessa branch
name: Imagens

on:
  push:
    branches: [main, "dev-sprint*"]
    paths: ["backend/**", ".github/workflows/imagens.yml"]
  workflow_dispatch:

# O GITHUB_TOKEN só pode ler o código e publicar pacotes (imagens). Nada mais.
permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: ${{ matrix.imagem }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - imagem: slotup-auth
            pasta: backend/auth-service
          - imagem: slotup-booking
            pasta: backend/booking-service
          - imagem: slotup-scheduling
            pasta: backend/scheduling-service
    env:
      # Os nomes no ghcr.io têm de estar em minúsculas
      IMAGEM: ghcr.io/joshuacamilo09/${{ matrix.imagem }}
    steps:
      - uses: actions/checkout@v4

      - name: Entrar no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

        # QEMU: deixa construir a versão arm64 numa máquina amd64 do GitHub
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.pasta }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGEM }}:${{ github.sha }}
            ${{ env.IMAGEM }}:${{ github.ref_name }}
          # Liga o pacote a este repositório (aparece na página do repo, em Packages)
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Cache entre execuções: só reconstrói as camadas que mudaram
          cache-from: type=gha,scope=${{ matrix.imagem }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagem }}