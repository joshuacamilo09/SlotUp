<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas reservas – SlotUp</title>

  <!-- Mesmas fontes das outras páginas: texto, horários (mono) e ícones -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">        <!-- cores, cabeçalho, botões, banner da vaga -->
  <link rel="stylesheet" href="css/componentes.css">  <!-- abas -->
  <link rel="stylesheet" href="css/reservas.css">     <!-- só desta página: lista e selos -->
</head>
<body>
  <div id="cabecalho"></div> <!-- o js/layout.js desenha o cabeçalho aqui -->

  <main class="conteudo">

    <!-- ===== Banner: vaga aberta (o mesmo da página inicial; só aparece com uma oferta) ===== -->
    <section id="banner-vaga" hidden>
      <div class="banner">
        <div class="banner-anel" id="vaga-anel">
          <div class="banner-tempo" id="vaga-tempo"></div>
        </div>
        <div class="banner-texto">
          <div class="banner-titulo">
            Abriu uma vaga para si: <span id="vaga-nome"></span>, <span id="vaga-quando"></span>
          </div>
          <div class="banner-sub">Está guardada até o tempo acabar. Depois passa para o próximo na fila.</div>
        </div>
        <div class="banner-acoes">
          <button class="botao botao-secundario" id="vaga-recusar">Recusar</button>
          <button class="botao botao-primario" id="vaga-confirmar">Confirmar vaga</button>
        </div>
      </div>
    </section>

    <h1 class="titulo-pagina">Minhas reservas</h1>

    <!-- ===== Abas: o data-aba diz qual painel cada uma mostra ===== -->
    <div class="abas" role="tablist" aria-label="Reservas">
      <button class="aba ativo" role="tab" data-aba="proximas" aria-selected="true">
        Próximas · <span id="conta-proximas">0</span>
      </button>
      <button class="aba" role="tab" data-aba="fila" aria-selected="false">
        Fila de espera · <span id="conta-fila">0</span>
      </button>
    </div>

    <!-- ===== Painéis: o JS enche-os com as linhas ===== -->
    <section id="painel-proximas" role="tabpanel"></section>
    <section id="painel-fila" role="tabpanel" hidden></section>

  </main>

  <!-- Ordem importa: api.js (pedidos) → layout.js (cabeçalho) → catalogo.js (ícones) → página -->
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/catalogo.js"></script>
  <script src="js/reservas.js"></script>
</body>
</html>
