<body class="auth auth-center">
    <main class="center wrap">
        <div class="center-card">

            <div class="card-top">
                <span class="auth-brand">
                    <svg viewBox="0 0 22 32" fill="none" aria-hidden="true">
                        <rect x="1.5" y="1.5" width="19" height="29" rx="9.5" stroke="#37776d" stroke-width="3"/>
            <circle cx="11" cy="10" r="3.6" fill="#37776d"/>

                    SlotUp

      primeiro passo dados de conta
<form id="register-form">
    <h1 class="auth-title">Criar conta</h1>
    <p class="auth-lead">A seguir vai configurar a verificação em dois passos.</p>

    <div class="field">
        <label form="email">Email</label>
        <input id="email" type="email" placeholder="nome@empresa.pt" autocomplete="username" required>
    </div>
    <div class="field">
        <label for="password">palavra-passe</label>
            <input id="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <botton class="btn block"type="submit" id="register-btn">Criar conta</button>
            <div id="register-alert" class="alert hidden" role="alert"></div>
            <p class="link-row">Já tem conta? <a href="login.html">Iniciar sessão</a></p>
</form>
