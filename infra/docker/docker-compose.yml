name: slotup

services:
  db:
    image: postgres:16
    container_name: slotup-bd
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      RESERVATION_DB_PASSWORD: ${RESERVATION_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - slotup-db-data:/var/lib/postgres/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  slotup-db-data: