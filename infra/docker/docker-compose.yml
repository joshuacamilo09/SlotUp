name: slotup

# ---------------------------------------------------------------------------
# Blocos reutilizados (x- = extensão: o Compose ignora-os como serviços).
# Cada "&nome" define um bloco; "<<: *nome" copia-o para dentro de um serviço.
# Assim as duas réplicas de cada serviço ficam iguais e só se escreve uma vez.
# ---------------------------------------------------------------------------
x-auth-image: &auth-image
  build: ../../backend/auth-service
  image: slotup-auth:dev                # uma só imagem para auth-migrate, auth-1 e auth-2

x-booking-image: &booking-image
  build: ../../backend/booking-service
  image: slotup-booking:dev

x-auth-env: &auth-env
  DB_HOST: db
  DB_NAME: auth_db
  DB_USER: auth_user
  DB_PASSWORD: ${AUTH_DB_PASSWORD}
  ADMIN_NAME: ${ADMIN_NAME:-Administrador}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  SEED_ENABLED: ${SEED_ENABLED:-false}
  SEED_TOTP_SECRET: ${SEED_TOTP_SECRET:-}
  SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}

x-booking-env: &booking-env
  DB_HOST: db
  DB_NAME: booking_db
  DB_USER: booking_user
  DB_PASSWORD: ${BOOKING_DB_PASSWORD}
  SCHEDULING_URL: http://scheduling:8003
  SEED_ENABLED: ${SEED_ENABLED:-false}

# Tudo o que as réplicas do auth têm em comum (menos o environment e a porta,
# que cada réplica define: o "<<" não junta listas nem mapas aninhados)
x-auth-service: &auth-service
  <<: *auth-image
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    auth-migrate:
      condition: service_completed_successfully
  secrets:
    - jwt_private_key
    - jwt_public_key
    - totp_encryption_key
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 5

x-booking-service: &booking-service
  <<: *booking-image
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    booking-migrate:
      condition: service_completed_successfully
  secrets:
    - jwt_public_key # só a pública: o booking valida tokens mas não os consegue criar
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/ready', timeout=3)"]
    interval: 10s
    timeout: 5s
    retries: 5

services:
  db:
    image: postgres:17.9
    container_name: slotup-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - slotup-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-migrate:
    <<: *auth-image                       # mesma imagem do auth
    container_name: slotup-auth-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      AUTH_DATABASE_URL: postgresql+psycopg://auth_user:${AUTH_DB_PASSWORD}@db:5432/auth_db
    command: ["alembic", "upgrade", "head"]   # roda as migrações e sai
    restart: "no"                             # não reinicia: é para rodar uma vez

  # ----- Servidor 1 e servidor 2 do auth: mesma imagem, mesmo banco -----
  # Sem container_name: o Compose dá um nome a cada contentor e o Nginx encontra-os
  # pelo nome do serviço (auth-1, auth-2). Só muda o INSTANCE_NAME e a porta no host.
  auth-1:
    <<: *auth-service
    environment:
      <<: *auth-env
      INSTANCE_NAME: auth-1
    ports:
      - "127.0.0.1:8001:8001"

  auth-2:
    <<: *auth-service
    environment:
      <<: *auth-env
      INSTANCE_NAME: auth-2
    ports:
      - "127.0.0.1:8011:8001"

  booking-migrate:
    <<: *booking-image                    # mesma imagem do booking
    container_name: slotup-booking-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      BOOKING_DATABASE_URL: postgresql+psycopg://booking_user:${BOOKING_DB_PASSWORD}@db:5432/booking_db
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # ----- Servidor 1 e servidor 2 do booking -----
  booking-1:
    <<: *booking-service
    environment:
      <<: *booking-env
      INSTANCE_NAME: booking-1
    ports:
      - "127.0.0.1:8002:8002"

  booking-2:
    <<: *booking-service
    environment:
      <<: *booking-env
      INSTANCE_NAME: booking-2
    ports:
      - "127.0.0.1:8012:8002"

  scheduling:
    build: ../../backend/scheduling-service
    container_name: slotup-scheduling
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27.5-alpine    # 1.27.3 ou mais recente: precisa do "resolve" no upstream
    container_name: slotup-nginx
    restart: unless-stopped
    depends_on:
      - auth-1
      - auth-2
      - booking-1
      - booking-2
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # Frontend montado só para leitura: editou o HTML, é só recarregar a página
      - ../../frontend:/usr/share/nginx/html:ro
      # A nossa configuração substitui a padrão do Nginx
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

# Segredos como ficheiros (montados em /run/secrets/<nome>). No Kubernetes passam a ser Secrets.
# Gerados por ./gen-secrets.sh; a pasta secrets/ NÃO vai para o Git.
secrets:
  jwt_private_key:
    file: ./secrets/jwt_private.pem
  jwt_public_key:
    file: ./secrets/jwt_public.pem
  totp_encryption_key:
    file: ./secrets/totp_encryption_key

volumes:
  slotup-db-data: