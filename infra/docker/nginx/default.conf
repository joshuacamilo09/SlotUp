# SlotUp · Nginx: serve o frontend e manda /api para o servidor 1, ou para o servidor 2 se o 1 falhar

# DNS interno do Docker. Com "valid=10s" o Nginx volta a perguntar o IP das
# réplicas a cada 10s: se o auth-1 ou o booking-2 reiniciar e mudar de IP,
# o Nginx encontra o novo sozinho (importante para o teste de falha).
# Fica fora do server{} porque os blocos upstream abaixo também o usam.
resolver 127.0.0.11 valid=10s ipv6=off;

# Formato do log com o caminho de cada pedido: que servidor tentou, o que respondeu
# e quanto demorou. Num failover aparecem os dois: "upstream=IP-do-1, IP-do-2 status=502, 200".
log_format failover '$remote_addr "$request" $status '
                    'upstream=$upstream_addr upstream_status=$upstream_status '
                    'tempo=$upstream_response_time';

# ---- Auth: servidor 1 principal, servidor 2 de reserva (backup) ----
upstream auth_servers {
    # zone: memória partilhada entre os workers do Nginx; o "resolve" precisa dela
    zone auth_servers 64k;
    # Servidor 1: recebe todos os pedidos. À primeira falha (max_fails=1) fica
    # 10 s de fora (fail_timeout=10s); depois o Nginx volta a experimentá-lo.
    # resolve: o nome é resolvido pelo resolver acima, também depois do arranque.
    server auth-1:8001 resolve max_fails=1 fail_timeout=10s;
    # Servidor 2: backup. Só recebe pedidos quando o servidor 1 falha.
    server auth-2:8001 resolve backup;
}

# ---- Booking: igual ----
upstream booking_servers {
    zone booking_servers 64k;
    server booking-1:8002 resolve max_fails=1 fail_timeout=10s;
    server booking-2:8002 resolve backup;
}

server {
    listen 80;
    server_name _;

    # Onde estão os arquivos do frontend dentro do contentor
    root /usr/share/nginx/html;
    index index.html;
    
    # Diz ao navegador que HTML, CSS e JS estão em UTF-8 (sem isto os acentos podem estragar)
    charset utf-8;
    charset_types text/css application/javascript;

    # Cabeçalhos de segurança básicos em todas as respostas
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Log com o caminho de cada pedido (ver log_format acima): docker compose logs nginx
    access_log /var/log/nginx/access.log failover;

    # ----- Failover: timeouts curtos e repetir o pedido no servidor 2 -----
    # Ligar a uma réplica que não responde: desiste ao fim de 1 s
    proxy_connect_timeout 1s;
    # Réplica ligada mas pendurada (sem resposta): desiste ao fim de 5 s
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    # Quando o servidor 1 falha, o mesmo pedido é feito no servidor 2:
    #   error   = ligação recusada ou cortada (réplica em baixo)
    #   timeout = passou um dos tempos acima
    #   http_502/503/504 = a réplica respondeu com erro de "indisponível"
    # Um POST (login, reserva) só é repetido se ainda não chegou à réplica 1
    # (ex.: ligação recusada). Se já chegou, não se repete: podia ficar feito duas vezes.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;      # no máximo 2 tentativas: servidor 1 e servidor 2
    proxy_next_upstream_timeout 6s;   # e nunca mais de 6 s no total

    # Informações do pedido original para o FastAPI (IP real do utilizador, etc.).
    # Definidas aqui, valem para todos os location abaixo.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Os dois servidores em baixo: em vez da página HTML de erro do Nginx, devolve
    # 503 com um JSON igual aos erros da API ({"detail": ...}), que o frontend sabe mostrar
    error_page 502 504 =503 @api_indisponivel;
    location @api_indisponivel {
        default_type application/json;
        return 503 '{"detail":"Serviço temporariamente indisponível. Tente daqui a pouco."}';
    }

    # ----- Frontend: arquivos estáticos -------
    location / {
        try_files $uri $uri/ =404;
    }

    # ---- Auth: tudo que começa por /api/auth vai para o auth (servidor 1 ou 2) ----
    location /api/auth {
        proxy_pass http://auth_servers;
    }

    # ----- Booking: tudo que começa por /api/reservas vai para o booking (servidor 1 ou 2) -----
    location /api/reservas {
        proxy_pass http://booking_servers;
    }

    # ----- Demo do failover: que réplica respondeu? -----
    # curl http://localhost:8080/api/auth/whoami  →  "auth-1"; com o auth-1 parado  →  "auth-2"
    location = /api/auth/whoami {
        proxy_pass http://auth_servers/whoami;
    }
    location = /api/reservas/whoami {
        proxy_pass http://booking_servers/whoami;
    }
}