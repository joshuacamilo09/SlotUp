# SlotUp · Nginx: serve o frontend e reparte /api pelas réplicas dos microserviços

# DNS interno do Docker. Com "valid=10s" o Nginx volta a perguntar o IP das
# réplicas a cada 10s: se o auth-1 ou o booking-2 reiniciar e mudar de IP,
# o Nginx encontra o novo sozinho (importante para o teste de falha).
# Fica fora do server{} porque os blocos upstream abaixo também o usam.
resolver 127.0.0.11 valid=10s ipv6=off;

# ---- Réplicas do auth: servidor 1 e servidor 2 ----
# Sem mais nada, o Nginx alterna os pedidos (round-robin): 1, 2, 1, 2...
upstream auth_servers {
    # zone: memória partilhada entre os workers do Nginx; o "resolve" precisa dela
    zone auth_servers 64k;
    # resolve: o nome é resolvido pelo resolver acima, também depois do arranque
    # (o Nginx arranca mesmo que uma réplica ainda não exista)
    server auth-1:8001 resolve;
    server auth-2:8001 resolve;
}

# ---- Réplicas do booking ----
upstream booking_servers {
    zone booking_servers 64k;
    server booking-1:8002 resolve;
    server booking-2:8002 resolve;
}

server {
    listen 80;
    server_name _;

    # Onde estão os arquivos do frontend dentro do contentor
    root /usr/share/nginx/html;
    index index.html;
    
    # Diz ao navegador que HTML, CSS e JS estão em UTF-8 (sem isto os acentos podem estragar)
    charset utf-8;
    charset_types text/css application/javascript;

    # Cabeçalhos de segurança básicos em todas as respostas
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Informações do pedido original para o FastAPI (IP real do utilizador, etc.).
    # Definidas aqui, valem para todos os location abaixo.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ----- Frontend: arquivos estáticos -------
    location / {
        try_files $uri $uri/ =404;
    }

    # ---- Auth: tudo que começa por /api/auth vai para uma das réplicas do auth ----
    location /api/auth {
        proxy_pass http://auth_servers;
    }

    # ----- Booking: tudo que começa por /api/reservas vai para uma das réplicas do booking -----
    location /api/reservas {
        proxy_pass http://booking_servers;
    }

    # ----- Demo do balanceamento: que réplica respondeu? -----
    # curl http://localhost:8080/api/auth/whoami  →  {"service":"auth-service","instance":"auth-1"}, depois auth-2...
    location = /api/auth/whoami {
        proxy_pass http://auth_servers/whoami;
    }
    location = /api/reservas/whoami {
        proxy_pass http://booking_servers/whoami;
    }
}