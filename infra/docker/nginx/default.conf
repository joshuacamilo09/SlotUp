# SlotUp · Nginx: serve o frontend e encaminha /api para os microserviços
server {
    listen 80;
    server_name _;

    # Onde estão os arquivos do frontend dentro do contentor
    root /usr/share/nginx/html;
    index index.html;
    
    # Diz ao navegador que HTML, CSS e JS estão em UTF-8 (sem isto os acentos podem estragar)
    charset utf-8;
    charset_types text/css application/javascript;

    # DNS interno do Docker. Com "valid=10s" o Nginx volta a perguntar o IP dos
    # serviçcos a cada 10s: se o auth ou o booking reiniciar e mudar de IP,
    # o Nginx encontra o novo sozinho (importante para o testes de falha)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cabeçalhos de segurança básicos em todas as respostas
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # ----- Frontend: arquivos estáticos -------
    location / {
        try_files $uri $uri/ =404;
    }

    # ---- Auth: tudo que começa por /api/auth vai para o auth-service ----
    location /api/auth{
        # Endereço numa variável: obriga o Nginx a usar o resolver acima
        # (e deixa-o arrancar mesmo que o auth ainda não esteja de pé)
        set $auth_upstream http://auth:8001;
        proxy_pass $auth_upstream;

        # Informações do pedido original para o FastApi (IP real do utilizador, etc.)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- Booking: tudo que começa por /api/reservas vai para o booking-service -----
    location /api/reservas {
        set $booking_upstream http://booking:8002;
        proxy_pass $booking_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}