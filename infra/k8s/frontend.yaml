# Frontend no Kubernetes: a ENTRADA ÚNICA do SlotUp. O Nginx serve o site e encaminha
# /api/auth para o auth e /api/reservas para o booking, como o slotup-nginx do Docker
# Compose, mas agora com HTTPS. 2 réplicas.
#
#   https://localhost:8443   o SlotUp (HTTPS, com o certificado do Secret slotup-tls)
#   http://localhost:8081    redireciona para o HTTPS
#
# A configuração do Nginx está neste ConfigMap, e não na imagem. É um "template": ao
# arrancar, a imagem oficial do Nginx troca ${NGINX_LOCAL_RESOLVERS} pelo DNS do cluster
# e grava o resultado em /etc/nginx/conf.d/default.conf.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: slotup
data:
  default.conf.template: |
    # DNS do Kubernetes. Com "valid=5s" o Nginx volta a perguntar os IPs das réplicas a
    # cada 5 s: quando um pod morre ou nasce noutro nó, o Nginx dá por isso sozinho.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;

    # Log com o caminho de cada pedido: que réplica tentou, o que respondeu e quanto demorou
    log_format failover '$remote_addr "$request" $status '
                        'upstream=$upstream_addr upstream_status=$upstream_status '
                        'tempo=$upstream_response_time';

    # ---- Auth: as 2 réplicas, à vez ----
    # O Service "auth" é headless: o nome devolve o IP de cada réplica pronta.
    # O nome tem de ser completo (o Nginx não usa os domínios de procura do cluster).
    upstream auth_servers {
        zone auth_servers 64k;
        # À primeira falha (max_fails=1), a réplica fica 10 s de fora
        server auth.slotup.svc.cluster.local:8001 resolve max_fails=1 fail_timeout=10s;
    }

    # ---- Booking: igual ----
    upstream booking_servers {
        zone booking_servers 64k;
        server booking.slotup.svc.cluster.local:8002 resolve max_fails=1 fail_timeout=10s;
    }

    # ---- HTTP: só redireciona para o HTTPS ----
    server {
        listen 8080;
        server_name _;

        # Teste do Kubernetes: o Nginx está vivo e a servir
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # 8443 é a porta do HTTPS no computador (kind-cluster.yaml)
        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    # ---- HTTPS: o site e a API ----
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        # Certificado e chave do Secret slotup-tls (gen-cert.sh + create-secrets.sh)
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        root /usr/share/nginx/html;
        index index.html;

        charset utf-8;
        charset_types text/css application/javascript;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        access_log /var/log/nginx/access.log failover;

        # ----- Failover: igual ao Docker Compose -----
        # Se uma réplica não responder, o mesmo pedido é repetido na outra
        proxy_connect_timeout 1s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 6s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # As duas réplicas em baixo: 503 com um JSON igual aos erros da API
        error_page 502 504 =503 @api_indisponivel;
        location @api_indisponivel {
            default_type application/json;
            return 503 '{"detail":"Serviço temporariamente indisponível. Tente daqui a pouco."}';
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location /api/auth {
            proxy_pass http://auth_servers;
        }

        location /api/reservas {
            proxy_pass http://booking_servers;
        }

        # Que réplica respondeu? Cada pedido pode cair numa réplica diferente:
        #   curl .../api/auth/whoami  ->  {"instance": "auth-7c9f...-abcde"}
        location = /api/auth/whoami {
            proxy_pass http://auth_servers/whoami;
        }
        location = /api/reservas/whoami {
            proxy_pass http://booking_servers/whoami;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: slotup
  labels:
    app: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
            # Uma réplica em cada nó (Servidor 1 e Servidor 2), nunca as duas no mesmo.
      # Se um servidor cair, a réplica do outro continua a responder.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: frontend
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: ghcr.io/joshuacamilo09/slotup-frontend:dev-sprint7
          imagePullPolicy: Always
          env:
            # Pede à imagem do Nginx para preencher ${NGINX_LOCAL_RESOLVERS} com o DNS do cluster
            - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
              value: "1"
            # Só troca essa variável no template: $host, $uri... são do Nginx e ficam como estão
            - name: NGINX_ENVSUBST_FILTER
              value: NGINX_LOCAL_RESOLVERS
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          # O Kubernetes testa o Nginx pelo /health (ver o ConfigMap acima)
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: frontend-nginx
        - name: tls
          secret:
            secretName: slotup-tls
---
# NodePort: abre as portas 30443 e 30080 em todos os nós. O kind liga o 8443 e o 8081
# do computador a essas portas no nó de controlo (kind-cluster.yaml).
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: slotup
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: https
      port: 8443
      targetPort: https
      nodePort: 30443
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080