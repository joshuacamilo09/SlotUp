# scheduling-service (o CSP que planeia o dia) no Kubernetes: 2 réplicas, uma em cada nó.
# Não tem banco nem segredos: só faz cálculos (cada pedido pára aos 2 s ou 200 mil nós).
# É INTERNO: só o booking lhe fala, em http://scheduling:8003 (SCHEDULING_URL no ConfigMap
# booking-config). Não tem NodePort nem rota no Nginx do frontend, por isso o browser
# não lhe chega (https://localhost:8443/api/scheduling/... dá 404).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduling
  namespace: slotup
  labels:
    app: scheduling
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: scheduling
  template:
    metadata:
      labels:
        app: scheduling
    spec:
      automountServiceAccountToken: false
      # Sem as variáveis automáticas dos Services (ex.: SCHEDULING_PORT=tcp://...), que
      # podiam ter o nome de uma variável da nossa configuração
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
              # Uma réplica em cada nó (Servidor 1 e Servidor 2), nunca as duas no mesmo.
      # Se um servidor cair, a réplica do outro continua a responder.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: scheduling
              topologyKey: kubernetes.io/hostname
      containers:
        - name: scheduling
          image: ghcr.io/joshuacamilo09/slotup-scheduling:dev-sprint8
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8003
          # O Kubernetes testa o pod pelo /health:
          #   startup: dá até 60 s para arrancar antes dos outros testes
          #   liveness: o processo está vivo? Se falhar 3 vezes, o pod é reiniciado
          #   readiness: consegue servir pedidos (no auth e no booking: o banco responde)?
          #   Se não, sai do Service e deixa de receber pedidos, mas não é reiniciado
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
---
# Headless (clusterIP: None), como o do auth e o do booking: o nome "scheduling" devolve
# o IP de cada réplica pronta. O cliente do booking (httpx) tenta os IPs por ordem: se a
# réplica de um nó que caiu não aceitar a ligação em 0,5 s, passa logo para a outra.
# Com um IP único, o Kubernetes podia continuar a mandar metade dos pedidos para a
# réplica morta durante cerca de 1 min, até dar o nó como caído.
apiVersion: v1
kind: Service
metadata:
  name: scheduling
  namespace: slotup
spec:
  clusterIP: None
  selector:
    app: scheduling
  ports:
    - name: http
      port: 8003
      targetPort: http